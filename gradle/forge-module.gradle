// Shared setup for every mod's `forge` module. Each forge module compiles its sibling `common`
// module's sources and resources into one mod jar, then reobfuscates it for release.

def commonProject = project.parent.project('common')
def mixinConfigName = "${mod_id}.mixins.json"
def hasMixins = commonProject.file("src/main/resources/${mixinConfigName}").exists()
// Mixins that target Forge's own classes live in the forge module's resources.
def forgeMixinConfigName = "${mod_id}.forge.mixins.json"
def hasForgeMixins = project.file("src/main/resources/${forgeMixinConfigName}").exists()

// Impact mods this one builds on, as project folders (for example impacts-lib), from its gradle.properties.
def dependencyModProjects = (findProperty('mod_dependencies') ?: '').split(',').collect { it.trim() }.findAll { !it.isEmpty() }
        .collect { dependencyName -> project(":${dependencyName}:forge") }
dependencyModProjects.each { dependencyProject -> evaluationDependsOn(dependencyProject.path) }
// Mods that need the Curios API (Inventory's back slot) set mod_requires_curios=true in their gradle.properties. Mods with
// optional Curios support (Vitality's head slot) set mod_uses_curios=true: compile-only, and their own runs leave it out.
def isRequiringCurios = (findProperty('mod_requires_curios') ?: 'false').toBoolean()
def isUsingCurios = isRequiringCurios || (findProperty('mod_uses_curios') ?: 'false').toBoolean()
// Mods with optional playerAnimator support (Lib's hold-to-use animations) set mod_uses_player_animator=true. It is
// compile-only: the mod's own runs leave it out, so they test the fallback; test setups can load it.
def isUsingPlayerAnimator = (findProperty('mod_uses_player_animator') ?: 'false').toBoolean()
// Mods with JEI pages set mod_uses_jei=true (compile-only API); mod_runs_with_jei=true also loads JEI in their runs.
def isUsingJei = (findProperty('mod_uses_jei') ?: 'false').toBoolean()
def isRunningWithJei = (findProperty('mod_runs_with_jei') ?: 'false').toBoolean()
// In development, a dependency's Mixin configs come from launch arguments.
def dependencyMixinConfigs = dependencyModProjects.collectMany { dependencyProject ->
    def dependencyModId = dependencyProject.property('mod_id')
    [
            dependencyProject.parent.project('common').file("src/main/resources/${dependencyModId}.mixins.json"),
            dependencyProject.file("src/main/resources/${dependencyModId}.forge.mixins.json")
    ].findAll { configFile -> configFile.exists() }.collect { configFile -> configFile.name }
}

// One group per mod: every mod's modules are named common and forge, and Gradle tells modules apart by group.
group = "${mod_group}.${mod_id}"
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${parchment_minecraft_version}"

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // GameTests are filtered by their template's namespace, and mods reuse Lib's empty template.
            property 'forge.enabledGameTestNamespaces', ([mod_id] + dependencyModProjects.collect { dependencyProject -> dependencyProject.property('mod_id') }).join(',')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            dependencyMixinConfigs.each { configName ->
                args '--mixin.config', configName
            }
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
                dependencyModProjects.each { dependencyProject ->
                    "${dependencyProject.property('mod_id')}" {
                        source dependencyProject.sourceSets.main
                    }
                }
            }
        }

        client {
        }

        // A client that loads straight into the world saved as run/saves/ImpactsTest, for scripted screenshots.
        clientQuickPlay {
            parent runs.client
            args '--quickPlaySingleplayer', 'ImpactsTest'
        }

        server {
            args '--nogui'
        }

        gameTestServer {
        }

        data {
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/'),
                    '--existing', commonProject.file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            // JEI's runtime jar depends on mezz's config library from the same repository.
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
        content {
            includeGroup 'dev.kosmx.player-anim'
        }
    }
}

// Mods with a <modid>.mixins.json (common) or <modid>.forge.mixins.json (forge) get Mixin's refmap and manifest entry.
if (hasMixins || hasForgeMixins) {
    apply plugin: 'org.spongepowered.mixin'
    mixin {
        add sourceSets.main, "${mod_id}.refmap.json"
        if (hasMixins) {
            config mixinConfigName
        }
        if (hasForgeMixins) {
            config forgeMixinConfigName
        }
    }
    dependencies {
        annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    dependencyModProjects.each { dependencyProject -> compileOnly dependencyProject.sourceSets.main.output }
    if (isUsingJei) {
        compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
        compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    }
    if (isRunningWithJei) {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }
    if (isUsingPlayerAnimator) {
        compileOnly fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}")
    }
    if (isUsingCurios) {
        // Compile against Curios's API only; the runs of mods that require it load the whole mod.
        compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    }
    if (isRequiringCurios) {
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    }
}

tasks.matching { task -> task.name.startsWith('prepareRun') }.configureEach { prepareTask ->
    prepareTask.dependsOn dependencyModProjects.collect { dependencyProject -> "${dependencyProject.path}:classes" }
}

tasks.named('compileJava', JavaCompile) {
    source(commonProject.sourceSets.main.allJava)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
    options.compilerArgs << '-Xlint:deprecation'
}

def modMetadata = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_description        : mod_description,
        mod_authors            : mod_authors,
        mod_license            : mod_license,
        minecraft_version_range: minecraft_version_range,
        forge_version_range    : forge_version_range,
        lib_version_range      : lib_version_range,
        impact_mod_version_range: impact_mod_version_range,
        srf_version_range      : srf_version_range,
        curios_version_range   : curios_version_range,
        loader_version_range   : loader_version_range,
]

tasks.named('processResources', ProcessResources) {
    from(commonProject.sourceSets.main.resources)
    inputs.properties(modMetadata)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(modMetadata)
    }
}

tasks.named('jar', Jar) {
    // Every release jar carries the license and the AI notice (see NOTICE).
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

// Every mod's finished (reobfuscated) jar is also copied to <root>/build/mods/, so one folder holds the whole family
// after `./gradlew build`.
def collectModJar = tasks.register('collectModJar', Copy) {
    group = 'build'
    description = 'Copies this mod\'s finished jar into the root build/mods folder.'
    dependsOn 'reobfJar'
    from(tasks.named('jar', Jar).flatMap { modJar -> modJar.archiveFile })
    into(rootProject.layout.buildDirectory.dir('mods'))
}
tasks.named('assemble') {
    finalizedBy collectModJar
}

// GameTests check the specs' numbers, so every run starts from default Impact config: files left by a dev run, or written
// before a default changed, would otherwise be read instead (and could hide a test that no longer matches the defaults).
tasks.matching { task -> task.name == 'runGameTestServer' }.configureEach { runTask ->
    runTask.doFirst {
        project.delete(project.file('run/config/impactslib'), project.file('run/world/serverconfig/impactslib'))
    }
}
