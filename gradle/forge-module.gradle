// Shared setup for every mod's `forge` module. Each forge module compiles its sibling `common`
// module's sources and resources into one mod jar, then reobfuscates it for release.

def commonProject = project.parent.project('common')
def mixinConfigName = "${mod_id}.mixins.json"
def hasMixins = commonProject.file("src/main/resources/${mixinConfigName}").exists()
// Mixins that target Forge's own classes live in the forge module's resources.
def forgeMixinConfigName = "${mod_id}.forge.mixins.json"
def hasForgeMixins = project.file("src/main/resources/${forgeMixinConfigName}").exists()

// Impact mods this one builds on, as project folders (for example impacts-lib), from its gradle.properties.
def dependencyModProjects = (findProperty('mod_dependencies') ?: '').split(',').collect { it.trim() }.findAll { !it.isEmpty() }
        .collect { dependencyName -> project(":${dependencyName}:forge") }
dependencyModProjects.each { dependencyProject -> evaluationDependsOn(dependencyProject.path) }
// In development, a dependency's Mixin configs come from launch arguments.
def dependencyMixinConfigs = dependencyModProjects.collectMany { dependencyProject ->
    def dependencyModId = dependencyProject.property('mod_id')
    [
            dependencyProject.parent.project('common').file("src/main/resources/${dependencyModId}.mixins.json"),
            dependencyProject.file("src/main/resources/${dependencyModId}.forge.mixins.json")
    ].findAll { configFile -> configFile.exists() }.collect { configFile -> configFile.name }
}

// One group per mod: every mod's modules are named common and forge, and Gradle tells modules apart by group.
group = "${mod_group}.${mod_id}"
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${parchment_minecraft_version}"

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // GameTests are filtered by their template's namespace, and mods reuse Lib's empty template.
            property 'forge.enabledGameTestNamespaces', ([mod_id] + dependencyModProjects.collect { dependencyProject -> dependencyProject.property('mod_id') }).join(',')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            dependencyMixinConfigs.each { configName ->
                args '--mixin.config', configName
            }
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
                dependencyModProjects.each { dependencyProject ->
                    "${dependencyProject.property('mod_id')}" {
                        source dependencyProject.sourceSets.main
                    }
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        gameTestServer {
        }

        data {
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/'),
                    '--existing', commonProject.file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

// Mods with a <modid>.mixins.json (common) or <modid>.forge.mixins.json (forge) get Mixin's refmap and manifest entry.
if (hasMixins || hasForgeMixins) {
    apply plugin: 'org.spongepowered.mixin'
    mixin {
        add sourceSets.main, "${mod_id}.refmap.json"
        if (hasMixins) {
            config mixinConfigName
        }
        if (hasForgeMixins) {
            config forgeMixinConfigName
        }
    }
    dependencies {
        annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    dependencyModProjects.each { dependencyProject -> compileOnly dependencyProject.sourceSets.main.output }
}

tasks.matching { task -> task.name.startsWith('prepareRun') }.configureEach { prepareTask ->
    prepareTask.dependsOn dependencyModProjects.collect { dependencyProject -> "${dependencyProject.path}:classes" }
}

tasks.named('compileJava', JavaCompile) {
    source(commonProject.sourceSets.main.allJava)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
    options.compilerArgs << '-Xlint:deprecation'
}

def modMetadata = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_description        : mod_description,
        mod_authors            : mod_authors,
        mod_license            : mod_license,
        minecraft_version_range: minecraft_version_range,
        forge_version_range    : forge_version_range,
        lib_version_range      : lib_version_range,
        impact_mod_version_range: impact_mod_version_range,
        srf_version_range      : srf_version_range,
        loader_version_range   : loader_version_range,
]

tasks.named('processResources', ProcessResources) {
    from(commonProject.sourceSets.main.resources)
    inputs.properties(modMetadata)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(modMetadata)
    }
}

tasks.named('jar', Jar) {
    // Every release jar carries the license and the AI notice (see NOTICE).
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}
