pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
    plugins {
        id 'org.spongepowered.gradle.vanilla' version '0.2.2'
    }
}

rootProject.name = 'impacts-dev'

include 'impacts-lib:common'
include 'impacts-lib:forge'
include 'impacts-inventory:common'
include 'impacts-inventory:forge'

// Every folder in test-setups/ with a gradle.properties is one family test setup.
file('test-setups').listFiles()
        ?.findAll { setupFolder -> setupFolder.isDirectory() && new File(setupFolder, 'gradle.properties').exists() }
        ?.sort { setupFolder -> setupFolder.name }
        ?.each { setupFolder -> include "test-setups:${setupFolder.name}" }
